<div id="momentsPlatform"
    class="fixed inset-0 z-[150] bg-black text-white overflow-hidden transition-opacity duration-300">

    <div
        class="absolute top-0 left-0 w-full z-50 flex justify-between items-end px-6 md:px-12 pt-8 pb-4 bg-gradient-to-b from-black/80 to-transparent">
        <div class="flex items-baseline gap-2">
            <h1 class="text-2xl md:text-3xl font-black tracking-[-0.15em] text-white">ZARA</h1>
            <span class="text-[10px] md:text-xs font-light tracking-[0.2em] uppercase opacity-70 text-white">STAFF
                MOMENTS</span>
        </div>
        <div class="flex items-center gap-6 text-white">
            <button id="openUploadBtn"
                class="hover:opacity-60 transition-opacity text-[10px] uppercase tracking-widest font-bold flex items-center gap-2 cursor-pointer">
                <span>YENİ AN PAYLAŞ</span>
                <i class="fa-solid fa-plus"></i>
            </button>
            <button id="closePlatformBtn"
                class="hover:opacity-60 transition-opacity text-[10px] uppercase tracking-widest font-bold flex items-center gap-2 cursor-pointer">
                <span>GERİ</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <div class="zara-container w-full h-full bg-black">

    </div>

    <!-- Şərh Paneli (Comment Panel) -->
    <div id="commentPanel"
        class="fixed top-0 right-0 h-full w-80 md:w-96 bg-zinc-950 text-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 p-6 flex flex-col border-l border-white/10">
        <div class="flex items-center justify-between pb-4 border-b border-white/10">
            <h3 class="text-xs font-bold tracking-widest uppercase">YORUMLAR (0)</h3>
            <button id="closeCommentsBtn" class="text-zinc-400 hover:text-white cursor-pointer transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Şərhlərin Listələndiyi Yer -->
        <div id="commentsList" class="flex-1 overflow-y-auto py-4 space-y-4 pr-1">
            <!-- Şərhlər dinamik bura gələcək -->
        </div>

        <!-- 🌟 YENİ: Cavab Verilən Şərhin İndikatoru -->
        <div id="replyIndicator"
            class="hidden bg-zinc-900 p-2 text-[10px] tracking-widest text-zinc-400 flex items-center justify-between border-t border-white/5 uppercase">
            <span><strong id="replyTargetName">STAFF</strong> vasitəsilə cavablandırılır...</span>
            <button id="cancelReplyBtn" class="text-red-400 hover:text-red-300 font-bold ml-2">LƏĞV ET</button>
        </div>

        <!-- Şərh Yazma Formu -->
        <form id="commentForm" class="pt-4 border-t border-white/10 flex items-center gap-2">
            <input type="text" id="commentInput" placeholder="YORUM YAZ..." autocomplete="off"
                class="flex-1 bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-xs font-light tracking-wide text-white placeholder-zinc-500 uppercase focus:outline-none focus:border-zinc-700">
            <button type="submit" id="sendCommentBtn"
                class="bg-white text-black text-[10px] tracking-widest font-bold px-4 py-2.5 rounded transition hover:bg-zinc-200 uppercase">
                GÖNDƏR
            </button>
        </form>
    </div>
</div>
<div id="uploadModal" style="display: none;" class="fixed inset-0 z-[250] px-4 flex items-center justify-center">
    <div id="modalOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-[450px] bg-white text-black p-8 md:p-10 shadow-2xl z-10 rounded-sm">

        <button id="closeUploadBtn" type="button"
            class="absolute top-4 right-4 text-neutral-400 hover:text-black text-lg transition-colors cursor-pointer p-2 leading-none z-30">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="mb-6 select-none">
            <h3 class="text-sm font-black tracking-widest uppercase text-black">YENİ AN PAYLAŞ</h3>
            <p class="text-[9px] text-neutral-400 font-light tracking-wide mt-0.5 uppercase">ZARA GANJLIK MALL STAFF
                PORTAL</p>
        </div>

        <form id="uploadForm" class="flex flex-col gap-5">
            <div
                class="relative w-full h-36 border border-dashed border-neutral-300 flex flex-col items-center justify-center p-4 bg-neutral-50 hover:bg-neutral-100 transition-colors cursor-pointer group rounded-sm">
                <input type="file" id="videoInput" accept="video/*"
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" required />
                <div id="uploadPlaceholder" class="text-center flex flex-col items-center gap-1 pointer-events-none">
                    <i
                        class="fa-solid fa-cloud-arrow-up text-neutral-400 text-lg group-hover:text-black transition-colors"></i>
                    <p class="text-[10px] font-bold tracking-widest uppercase text-black">VİDEO SEÇİN</p>
                    <p class="text-[9px] text-neutral-400 font-light">MP4 format, max 50MB</p>
                </div>
                <div id="fileSelectedName" class="hidden text-center p-2 pointer-events-none">
                    <i class="fa-solid fa-circle-check text-green-600 text-lg block mb-1"></i>
                    <p class="text-[11px] font-medium truncate max-w-[280px] text-neutral-700" id="fileNameText">
                        video.mp4</p>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-[9px] font-bold tracking-widest uppercase text-neutral-500">BU ANIN HEKAYƏSİ
                    NƏDİR?</label>
                <textarea id="captionInput" rows="3"
                    placeholder="Gənclik Mall komandası ilə keçən o maraqlı günü təsvir et..."
                    class="w-full text-xs p-3 bg-white border border-neutral-200 text-black outline-none resize-none font-light focus:border-black transition-colors rounded-sm"
                    required></textarea>
            </div>

            <button type="submit"
                class="w-full bg-black text-white text-[10px] font-bold tracking-widest py-4 uppercase hover:bg-neutral-800 transition-colors cursor-pointer">
                YÜKLƏ VƏ TƏSDİQƏ GÖNDƏR
            </button>
        </form>
    </div>
</div>


</div>

    /* Videoların tam ekrana saniyəsində yapışması üçün */
    .zara-container {
        scroll-snap-type: y mandatory;
        overflow-y: scroll;
        height: 100vh;
        scrollbar-width: none;
    }

    .zara-container::-webkit-scrollbar {
        display: none;
    }

    .zara-card {
        scroll-snap-align: start;
        scroll-snap-stop: always;
        height: 100vh;
    }
