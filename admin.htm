<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>GNC | Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@100;300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: white;
        }

        .font-sync {
            font-family: 'Syncopate', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        #admin-main-content {
            display: none;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
</head>

<body class="min-h-screen p-6 md:p-12">
    <!-- Yoxlama müddətində görünəcək ekran -->
    <div id="loader-overlay" class="loading-overlay">
        <p class="font-sync text-[10px] tracking-[0.5em] uppercase animate-pulse">Authenticating...</p>
    </div>
    <div id="admin-main-content">
        <header class="max-w-6xl mx-auto flex justify-between items-center mb-12">
            <div>
                <h1 class="font-sync text-xl tracking-tighter uppercase">GNC. <span class="text-white/20">Admin</span>
                </h1>
                <p class="text-[9px] uppercase tracking-[0.4em] text-white/40 mt-1">Management Console</p>
            </div>
            <div>
                <button id="back-btn"
                    class="text-[9px] uppercase tracking-widest border border-white/10 px-4 py-2 hover:bg-white hover:text-black transition mr-2">
                    Back
                </button>
                <button id="logout-btn"
                    class="text-[9px] uppercase tracking-widest border border-white/10 px-4 py-2 hover:bg-white hover:text-black transition">
                    Logout
                </button>
            </div>

        </header>

        <main class="max-w-6xl mx-auto">
            <!-- FOR HERO SECTION -->
            <div class="mt-16">
                <div class="max-w-6xl mx-auto mb-8">
                    <h2 class="text-[20px] uppercase tracking-widest text-white font-bold">Hero Section Ayarları</h2>
                </div>

                <div class="glass p-8 rounded-sm mb-8">
                    <form id="hero-settings-form" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-4">
                                <label class="text-[9px] uppercase tracking-widest text-white/30 block">Başlıq
                                    Yazısı</label>
                                <input type="text" id="hero-title-input" placeholder="Məsələn: GANDJLIK 6615"
                                    class="w-full bg-transparent border-b border-white/10 py-3 text-[10px] tracking-widest outline-none focus:border-white transition-all  text-white">
                            </div>

                            <div class="space-y-4">
                                <label class="text-[9px] uppercase tracking-widest text-white/30 block">Arxa Fon
                                    Şəkli</label>
                                <div class="flex items-center gap-4">
                                    <input type="file" id="hero-file-input" accept="image/*"
                                        class="flex-1 bg-white/5 border border-white/5 py-3 px-4 text-[9px] outline-none cursor-pointer">
                                    <div id="preview-box"
                                        class="w-20 h-20 border border-white/10 rounded hidden overflow-hidden">
                                        <img id="preview-img" class="w-full h-full object-cover">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit"
                            class="bg-white text-black px-12 py-4 text-[9px] font-bold uppercase tracking-widest hover:bg-zinc-200 transition">
                            Yadda Saxla və Yenilə
                        </button>
                    </form>
                </div>
            </div>
            <!-- EXPLORE MOMENTS -->
            <div class="my-8">
                <div class="glass p-8 rounded-sm">
                    <div
                        class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-white/10 pb-4 mb-8 gap-4">
                        <div>
                            <h2 class="font-sync text-xs tracking-widest uppercase">Moments Management</h2>
                            <p class="text-[9px] uppercase tracking-widest text-white/30 mt-1">Review pending videos or
                                manage the live moments feed</p>
                        </div>

                        <div class="flex gap-2 select-none">
                            <button id="tabPendingBtn"
                                class="border border-white bg-white text-black text-[9px] font-bold tracking-widest px-4 py-2 uppercase transition cursor-pointer">
                                Pending (<span id="pendingCount">0</span>)
                            </button>
                            <button id="tabLiveBtn"
                                class="border border-white/10 bg-transparent text-white/40 text-[9px] font-bold tracking-widest px-4 py-2 uppercase transition hover:border-white/20 cursor-pointer">
                                Live Feed (<span id="liveCount">0</span>)
                            </button>
                        </div>
                    </div>

                    <div id="adminMomentsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
                </div>
            </div>
            <!-- MANAGE CREW & STAFF -->
            <div class="space-y-12">

                <!-- CREW SECTION -->
                <section class="glass p-8 rounded-sm">
                    <h2 class="font-sync text-xl font-bold tracking-tighter mb-8 text-white">MANAGE CREW</h2>

                    <form id="add-crew-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4 mb-10">
                        <input type="text" id="crew-name" placeholder="NAME" required
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white uppercase">

                        <input type="text" id="crew-role" placeholder="ROLE" required
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white uppercase">

                        <input type="text" id="crew-id" placeholder="ID CODE" required
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white uppercase">

                        <input type="email" id="crew-email" placeholder="EMAIL" required
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white uppercase">

                        <input type="password" id="crew-password" placeholder="PASSWORD"
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white">

                        <div class="relative border-b border-white/10 focus-within:border-white">
                            <select id="crew-access-level" required
                                class="w-full bg-transparent py-3 text-[10px] tracking-[0.2em] text-white/50 outline-none appearance-none cursor-pointer uppercase font-light">
                                <option value="user" class="bg-[#111] text-white">User (Staff)</option>
                                <option value="admin" class="bg-[#111] text-white">Admin (Full Access)</option>
                            </select>
                            <div
                                class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2 text-white/30 text-[8px]">
                                ▼
                            </div>
                        </div>

                        <button type="submit" id="crew-submit-btn"
                            class="border border-white/20 py-3 text-[9px] uppercase tracking-[0.4em] hover:bg-white hover:text-black transition-all lg:col-span-6 mt-2">
                            Add Crew
                        </button>
                    </form>

                    <div class="max-h-[300px] overflow-y-auto overflow-x-auto">
                        <table class="w-full text-left" style="table-layout: fixed; border-collapse: collapse;">
                            <thead class="sticky top-0 bg-[#111]">
                                <tr
                                    class="border-b border-white/10 text-[8px] uppercase tracking-[0.4em] text-white/30">
                                    <th class="pb-4 w-[25%]">Member</th>
                                    <th class="pb-4 w-[20%]">Role</th>
                                    <th class="pb-4 w-[15%]">ID</th>
                                    <th class="pb-4 w-[25%]">Email</th>
                                    <th class="pb-4 w-[15%] text-right pr-6">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="crew-table-body"></tbody>
                        </table>
                    </div>
                </section>

                <!-- STAFF SECTION (Eyni dizayn) -->
                <section class="glass p-8 rounded-sm">
                    <h2 class="font-sync text-xl font-bold tracking-tighter mb-8 text-white">MANAGE STAFF</h2>

                    <form id="add-staff-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4 mb-10">
                        <input type="text" id="staff-name" placeholder="NAME" required
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white uppercase">

                        <input type="text" id="staff-role" placeholder="ROLE" required
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white uppercase">

                        <input type="text" id="staff-id" placeholder="ID CODE" required
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white uppercase">

                        <input type="email" id="staff-email" placeholder="EMAIL" required
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white uppercase">

                        <input type="password" id="staff-password" placeholder="PASSWORD"
                            class="bg-transparent border-b border-white/10 py-3 text-[10px] tracking-[0.2em] outline-none focus:border-white text-white">

                        <div class="relative border-b border-white/10 focus-within:border-white">
                            <select id="staff-access-level" required
                                class="w-full bg-transparent py-3 text-[10px] tracking-[0.2em] text-white/50 outline-none appearance-none cursor-pointer uppercase font-light">
                                <option value="user" class="bg-[#111] text-white">User (Staff)</option>
                                <option value="admin" class="bg-[#111] text-white">Admin (Full Access)</option>
                            </select>
                            <div
                                class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2 text-white/30 text-[8px]">
                                ▼
                            </div>
                        </div>

                        <button type="submit" id="staff-submit-btn"
                            class="border border-white/20 py-3 text-[9px] uppercase tracking-[0.4em] hover:bg-white hover:text-black transition-all lg:col-span-6 mt-2">
                            Add Staff
                        </button>
                    </form>

                    <div class="max-h-[300px] overflow-y-auto overflow-x-auto">
                        <table class="w-full text-left" style="table-layout: fixed; border-collapse: collapse;">
                            <thead class="sticky top-0 bg-[#111]">
                                <tr
                                    class="border-b border-white/10 text-[8px] uppercase tracking-[0.4em] text-white/30">
                                    <th class="pb-4 w-[25%]">Member</th>
                                    <th class="pb-4 w-[20%]">Role</th>
                                    <th class="pb-4 w-[15%]">ID</th>
                                    <th class="pb-4 w-[25%]">Email</th>
                                    <th class="pb-4 w-[15%] text-right pr-6">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="staff-table-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>


        </main>
    </div>


    <script type="module" src="./js/admin.js"></script>
</body>

</html>
